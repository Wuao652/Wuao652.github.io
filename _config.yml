# Jekyll site configuration for wuao652.github.io
#
# This file is a staging scaffold introduced by the migration to the
# Jekyll template (see docs/MIGRATION_PLAN.md, PR #2). The skeleton is
# faithful to the upstream template; identity values below are
# placeholders to be filled in during PR #5 (Personalization).
#
# For technical reasons, this file is *NOT* reloaded automatically when you
# run `bundle exec jekyll serve`. Restart the server after editing.

# Site identity
title: Wuao Liu
name: Wuao Liu
position:
email: wuaoliu@umass.edu
description: |-
  Staging description. The real bio migrates in PR #3 from the
  pre-migration index.html.

baseurl: ""
url: "https://wuao652.github.io/"

# External profiles (fill in during PR #5)
twitter_username:
linkedin_url:
github_username: Wuao652
google_scholar:
# google_analytics: G-XXXXXXXXXX

# Build settings
theme: minima
plugins:
  - jekyll-feed

sass:
  style: compact

# Exclude the pre-migration files from the Jekyll build so they are not
# copied into _site/. They are still served by GitHub Pages from the
# branch root until PR #4 swaps the live site over to the template.
exclude:
  - stylesheet.css
  - data/
  - docs/
  - README.md
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .bundle/
