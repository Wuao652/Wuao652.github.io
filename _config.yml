# Site identity
title: Wuao Liu
name: Wuao Liu
position: CS PhD Student
email: wuaoliu@umass.edu
description: |-
  I am a Computer Science Ph.D. student working in the Computer Vision Lab at [UMass Amherst](https://www.umass.edu/), advised by [Prof. Grant Van Horn](https://gvh.codes/). Previously, I received my M.S. and B.Eng. degrees in Robotics from [University of Michigan, Ann Arbor](https://robotics.umich.edu/) and [Zhejiang University](http://www.cse.zju.edu.cn/), respectively.

  My research leverages computer vision and machine learning for applications in AI4Science. I currently focus on visual and auditory recognition of fine-grained categories, such as wildlife species, to support biodiversity monitoring and conservation efforts.

  **<span style="color:red">I'm actively looking for PhD internship positions during summer 2026. Please feel free to contact me!</span>**

