- id: iNatSoundsMAE
  title: "Masked Autoencoders with Limited Data: Does It Work?<br>A Fine-Grained Bioacoustics Case Study"
  venue: "Workshop on Fine-Grained Visual Categorization @ CVPR 2026"
  awards:
